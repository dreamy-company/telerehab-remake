; =============================================================================
; Batas upload untuk aplikasi Telerehabilitasi
; =============================================================================
;
; Batas aplikasi adalah 100MB per file (UPLOAD_MAX_SIZE_KB=102400 di .env).
; Nilai di bawah ini sengaja diberi headroom di atas 100MB karena satu request
; multipart membawa lebih dari sekadar isi file (boundary, field lain, header).
;
; Cara pasang di VPS (Ubuntu/Debian, PHP 8.4):
;   sudo cp docs/php/99-upload.ini /etc/php/8.4/fpm/conf.d/99-upload.ini
;   sudo cp docs/php/99-upload.ini /etc/php/8.4/cli/conf.d/99-upload.ini
;   sudo systemctl restart php8.4-fpm
;
; Selengkapnya: docs/UPLOAD-LIMITS.md
; =============================================================================

; Ukuran maksimal SATU file yang diupload. Harus >= 100M.
upload_max_filesize = 128M

; Ukuran maksimal SELURUH body request. WAJIB lebih besar dari
; upload_max_filesize, kalau tidak PHP membuang $_POST dan user kena 419.
post_max_size = 150M

; Laravel membaca file upload ke memori saat validasi mimetypes.
memory_limit = 512M

; Upload 100MB lewat koneksi lambat bisa lebih dari 30 detik (default).
max_execution_time = 600
max_input_time = 600

; Form foto kondisi pasien mengizinkan pilih banyak file sekaligus.
; Default PHP hanya 20.
max_file_uploads = 50
